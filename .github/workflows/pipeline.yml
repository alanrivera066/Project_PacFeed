name: PacFeed CI/CD Pipeline

# Veredicto único: BLOQUEA si cualquier etapa de seguridad falla,
# PERMITE (y despliega) solo si las 4 etapas de seguridad pasan.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # ETAPA 1: Secretos (gitleaks)
  # Umbral: cero hallazgos — cualquier secreto bloquea
  # ─────────────────────────────────────────────
  secretos:
    name: 🔑 Etapa 1 — Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ─────────────────────────────────────────────
  # ETAPA 2: IaC (checkov)
  # Umbral: cero hallazgos HIGH/CRITICAL en reglas seleccionadas
  # ─────────────────────────────────────────────
  iac:
    name: 🏗️ Etapa 2 — IaC (checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar checkov
        run: pip install checkov==3.2.257

      - name: Ejecutar checkov sobre infra/
        run: |
          checkov -d infra/ \
            --framework terraform \
            --check CKV_AWS_20,CKV_AWS_54,CKV2_AWS_6,CKV_AWS_19 \
            --compact

  # ─────────────────────────────────────────────
  # ETAPA 3: SAST (bandit)
  # Umbral: bloquea con hallazgos MEDIUM o superiores.
  # (La inyección SQL B608 se reporta con confianza Low,
  #  por eso el umbral de confianza se fija en 'low'.)
  # ─────────────────────────────────────────────
  sast:
    name: 🔒 Etapa 3 — SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bandit
        run: pip install bandit==1.7.9

      - name: Ejecutar bandit — reporte completo
        run: |
          bandit -r app/ -f txt -o reportes/bandit_scan.txt --exit-zero || true
          cat reportes/bandit_scan.txt

      - name: Guardar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reportes/bandit_scan.txt

      - name: Verificar severidad — BLOQUEAR si hay hallazgos MEDIUM o superiores
        run: |
          echo "=== Verificando hallazgos de seguridad ==="
          bandit -r app/ \
            --severity-level medium \
            --confidence-level low \
            -f txt

  # ─────────────────────────────────────────────
  # ETAPA 4: Dependencias (pip-audit)
  # Umbral: cero CVE HIGH/CRITICAL
  # ─────────────────────────────────────────────
  dependencias:
    name: 📦 Etapa 4 — Dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        run: pip install pip-audit==2.7.3

      - name: Auditar dependencias
        run: |
          pip-audit -r app/requirements.txt \
            --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln PYSEC-2026-1999 \
            --ignore-vuln PYSEC-2026-1998 \
            --ignore-vuln PYSEC-2026-1994 \
            --ignore-vuln PYSEC-2026-1996 \
            --ignore-vuln PYSEC-2026-2132

  # ─────────────────────────────────────────────
  # BUILD: solo si las 4 etapas de seguridad pasan
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: [secretos, iac, sast, dependencias]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t pacfeed:${{ github.sha }} .

      - name: Confirmar build
        run: echo "Imagen construida correctamente - ${{ github.sha }}"

  # ─────────────────────────────────────────────
  # DEPLOY a QA: solo en push, tras build exitoso
  # ─────────────────────────────────────────────
  deploy-qa:
    name: 🚀 Deploy a QA
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.QA_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en instancia QA
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.QA_USER }}@${{ secrets.QA_HOST }} "cd ~/pacfeed && git pull origin ${{ github.ref_name }} && docker compose down && docker compose up -d --build && sleep 10 && curl -f http://localhost:5000/salud && echo 'Deploy QA exitoso'"

      - name: Confirmar deploy
        run: echo "Deploy completado en QA - ${{ secrets.QA_HOST }}"
